name: Publicar Modernize no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  qa:
    name: Testes estáticos e jornada do navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar arquivos e projeções
        run: node tests/static-check.mjs
      - name: Gerar os arquivos exatos da publicação
        run: node scripts/build-pages.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Executar jornadas E2E com dados sintéticos
        run: |
          python -m http.server 8767 --bind 127.0.0.1 --directory _site >/tmp/modernize-server.log 2>&1 &
          sleep 2
          python tests/qa.spec.py
      - name: Verificar landing institucional com Chromium
        run: |
          python -m http.server 8788 --bind 127.0.0.1 --directory _site >/tmp/modernize-landing.log 2>&1 &
          sleep 2
          python landing/tests/qa.py
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modernize-browser-qa
          path: |
            tests/artifacts/
            landing/tests/artifacts/
          if-no-files-found: ignore
  deploy:
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Verificar se Pages foi ativado no repositório
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages ainda não ativado. Acesse Settings > Pages > Source: GitHub Actions e execute novamente este workflow."
          fi
      - name: Configurar Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Preparar site estático
        if: steps.pages_check.outputs.enabled == 'true'
        run: node scripts/build-pages.mjs
      - name: Enviar arquivos
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
