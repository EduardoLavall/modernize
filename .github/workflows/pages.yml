name: Publicar Modernize no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  qa:
    name: Testes estáticos e jornada do navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar arquivos e projeções
        run: node tests/static-check.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Executar jornadas E2E com dados sintéticos
        run: |
          python -m http.server 8767 --bind 127.0.0.1 >/tmp/modernize-server.log 2>&1 &
          sleep 2
          python tests/qa.spec.py
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modernize-browser-qa
          path: tests/artifacts/
          if-no-files-found: ignore
  deploy:
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar site estático
        run: |
          mkdir -p _site/assets/brand _site/css _site/js
          cp index.html slides.html demo.html sw.js _site/
          cp css/app.css css/slides.css css/demo.css _site/css/
          cp js/finance.js js/slides.js js/demo.js _site/js/
          cp "assets/brand/Modernize logo.png" _site/assets/brand/
          cp "assets/brand/Glossy Red and Graphite M Logo.png" _site/assets/brand/
          touch _site/.nojekyll
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
